[project]
name = "langfuse-lab"
version = "0.1.0"
description = "A tiny CLI that walks through every major Langfuse feature using free open models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "langfuse==5.2.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
lflab = "lflab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lflab"]
